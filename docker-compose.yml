services:
  crm-frontend:
    container_name: crm-frontend

    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    env_file:
      - .env

    restart: unless-stopped

    ports:
      - "127.0.0.1:3211:3000"

    networks:
      - logicq1-network

networks:
  logicq1-network:
    external: true